<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflop Trainer</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="trainer">
        <header class="trainer__header">
            <h1 class="trainer__title">Preflop Trainer</h1>
            <div class="header-right">
                <span id="errorModeIndicator" class="error-mode-badge" style="display:none;">🔄 Работа над ошибками</span>
                <button class="trainer__stats-btn" id="statsBtn">📊 Статистика</button>
            </div>
        </header>

        <!-- РЕЖИМЫ -->
        <div class="modes">
            <button class="mode-btn active" data-mode="rfi">RFI (Open Raise)</button>
            <button class="mode-btn" data-mode="defend_bb">Защита BB</button>
            <button class="mode-btn" data-mode="3bet">3-Bet</button>
        </div>

        <!-- SETUP -->
        <div class="setup" id="setupPanel">
            <h2 class="setup__title">Выберите позиции</h2>

            <div class="setup__positions">
                <label class="setup__checkbox">
                    <input type="checkbox" id="allPositions" checked>
                    Все позиции
                </label>
            </div>

            <div class="setup__specific">
                <label><input type="checkbox" class="pos-check" value="ep"> EP</label>
                <label><input type="checkbox" class="pos-check" value="mp"> MP</label>
                <label><input type="checkbox" class="pos-check" value="co"> CO</label>
                <label><input type="checkbox" class="pos-check" value="btn"> BTN</label>
                <label><input type="checkbox" class="pos-check" value="sb"> SB</label>
                <label><input type="checkbox" class="pos-check" value="bb"> BB</label>
            </div>

            <!-- Размер рейза для защиты BB -->
            <div id="raiseSizeBlock" class="raise-size-block" style="display:none;">
                <p class="raise-size-label">Размер опен-рейза:</p>
                <div class="size-buttons">
                    <button class="size-btn" data-size="2.5">2.5 bb</button>
                    <button class="size-btn active" data-size="3">3 bb</button>
                    <button class="size-btn" data-size="both">Оба</button>
                </div>
            </div>

            <button class="setup__start-btn" id="startBtn">Начать тренировку</button>
        </div>

        <!-- GAME -->
        <div id="gamePanel" style="display: none;">
            <div class="session-stats">
                Сессия: <span id="sessionCorrect">0</span> / <span id="sessionTotal">0</span>
                (<span id="sessionPercent">0</span>%)
                <a href="#" id="resetToSetup" class="reset-link">← Выбрать позиции</a>
            </div>

            <div class="table">
                <div class="table__oval">
                    <div class="position-wrapper position-wrapper--ep">
                        <div class="position position--ep" data-pos="ep">EP</div>
                        <div class="bet-chip"></div>
                    </div>
                    <div class="position-wrapper position-wrapper--mp">
                        <div class="position position--mp" data-pos="mp">MP</div>
                        <div class="bet-chip"></div>
                    </div>
                    <div class="position-wrapper position-wrapper--co">
                        <div class="position position--co" data-pos="co">CO</div>
                        <div class="bet-chip"></div>
                    </div>
                    <div class="position-wrapper position-wrapper--btn">
                        <div class="position position--btn" data-pos="btn">BTN</div>
                        <div class="bet-chip"></div>
                    </div>
                    <div class="position-wrapper position-wrapper--sb">
                        <div class="position position--sb" data-pos="sb">SB</div>
                        <div class="bet-chip"></div>
                    </div>
                    <div class="position-wrapper position-wrapper--bb">
                        <div class="position position--bb" data-pos="bb">BB</div>
                        <div class="bet-chip"></div>
                    </div>

                    <div class="table__center">
                        <div class="hand" id="playerHand"></div>
                        <div id="currentPosition" class="current-position"></div>
                    </div>
                </div>
            </div>

            <div id="situationInfo" class="situation-info"></div>

            <div class="actions" id="actionsPanel">
                <!-- кнопки рендерятся из JS -->
            </div>

            <div class="result" id="resultPanel">
                <div id="resultMessage" class="result__message"></div>
                <button id="nextBtn" class="result__next-btn">Далее →</button>
            </div>
        </div>
    </div>

    <!-- STATS MODAL -->
    <div class="modal" id="statsModal">
        <div class="modal__content">
            <div class="modal__header">
                <h2>Статистика</h2>
                <button class="modal__close" id="closeModalBtn">✕</button>
            </div>
            <div class="stats">
                <div class="stats__item">
                    <span>Всего раздач:</span>
                    <strong id="totalHands">0</strong>
                </div>
                <div class="stats__item">
                    <span>Правильно:</span>
                    <strong id="correctHands">0</strong>
                </div>
                <div class="stats__item">
                    <span>Процент верных:</span>
                    <strong id="accuracy">0%</strong>
                </div>
                <div class="stats__item">
                    <span>Ошибок в списке:</span>
                    <strong id="errorCount">0</strong>
                </div>
            </div>
            <button class="stats__review-btn" id="reviewErrorsBtn">🔄 Работа над ошибками</button>
            <button class="stats__reset-btn" id="resetStatsBtn">Сбросить статистику</button>
        </div>
    </div>

    <!-- Range popup on hover -->
    <div class="range-popup" id="rangePopup">
        <div class="range-popup__title" id="rangePopupTitle"></div>
        <img id="rangePopupImg" src="" alt="Range chart">
    </div>

    <script src="main.js"></script>
</body>
</html>
